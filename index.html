function tricky(r,n){

  c.forEach((ch,k)=>{const nx=c[k+1],pv=c[k-1],L=c.slice(0,k+1),R=c.slice(k+1);
    if(O.includes(ch))add(A,nx==="う"?[...L,...c.slice(k+2)]:[...L,"う",...R]);
    if(E.includes(ch))add(A,nx==="い"?[...L,...c.slice(k+2)]:[...L,"い",...R]);
    if(ch==="ゅ"&&nx!=="う")add(A,[...L,"う",...R]);
    if(ch==="っ")add(A,[...c.slice(0,k),...R]);
    else if(k>0&&K.includes(ch)&&!"ゃゅょっ".includes(pv))add(A,[...c.slice(0,k),"っ",...c.slice(k)]);
    if(M[ch])add(B,c.map((x,j)=>j===k?M[ch]:x));
    if("ゃゅょ".includes(ch))[..."ゃゅょ".replace(ch,"")].forEach(y=>add(B,c.map((x,j)=>j===k?y:x)));
  });
  let o=shuf([...A]).slice(0,2);
  o=o.concat(shuf([...B]).slice(0,n-o.length));
  if(o.length<n)o=o.concat(shuf([...A].filter(x=>!o.includes(x))).slice(0,n-o.length));
  if(o.length<n)o=o.concat(shuf([...B].filter(x=>!o.includes(x))).slice(0,n-o.length));
  if(o.length<n)o=o.concat(shuf(items().map(i=>i[1]).filter(x=>x!==r&&!o.includes(x))).slice(0,n-o.length));

const BUNSETS={"JLPT N3":BUN3};
function nextB(){if(n>=PER)return done();const L=BUNSETS[curSet()]||[];const w=L.map(b=>{const p=S.p["文:"+b[0]];return p?5-p.b:6});let r=Math.random()*w.reduce((a,c)=>a+c,0),k=0;for(;k<L.length-1;k++){r-=w[k];if(r<=0)break}
  if(L.length>1&&L[k][0]===last)k=(k+1)%L.length;
  cur=L[k];cur.started=true;locked=false;qm="bp";draw()}
function showB(){const box=$("#q");if(!box)return;box.textContent="";
  box.append(el("div","prog","Soal "+(n+1)+" dari "+PER+" · benar "+ok));
  box.append(el("div","ask","Pilih yang tepat untuk mengisi bagian kosong"));
  box.append(el("div","sent",cur[0]));
  shuf([cur[1]].concat(cur[2].split(","))).forEach(t=>{const b=el("button","opt",t);b.onclick=()=>{if(locked)return;locked=true;box.querySelectorAll(".opt").forEach(o=>{if(o.textContent===cur[1])o.classList.add("ok");else if(o===b)o.classList.add("no")});finishB(t===cur[1],box)};box.append(b)})}
function finishB(good,box){const p=rec("文:"+cur[0]);if(good){p.b=Math.min(4,p.b+1);p.r++;ok++}else{p.b=0;p.x++}
  n++;last=cur[0];save();const f=el("div","fb "+(good?"ok":"no"));f.append(el("b","",good?"Benar":"Salah"),el("br"));
  f.append(el("span","",cur[0].replace("（　）",cur[1])),el("br"),el("span","",cur[3]));box.append(f);
  const nb=el("button","go",n>=PER?"Lihat skor":"Soal berikutnya");nb.onclick=()=>{cur.started=false;next()};box.append(nb);nb.focus()}
function bushu(box){const L=[...cur[0]].filter(c=>BU[c]);if(!L.length)return;const d=el("div","bu");d.append(el("b","","Bushu"));L.forEach(c=>{const r=el("div","bl");r.append(el("span","bk",c),el("span","",BU[c]));d.append(r)});box.append(d)}
function done(){
  const box=$("#q");if(!box){draw();return}
  box.textContent="";cur=null;
  box.append(el("div","word",ok+" / "+PER));
  box.append(el("div","ask",ok>=9?"Sangat kuat. Lanjutkan ke sesi berikutnya.":ok>=6?"Cukup baik. Kata yang salah akan muncul lebih sering.":"Masih banyak yang perlu diulang. Kata yang salah akan muncul lebih sering."));
  const b=el("button","go","Mulai sesi baru");b.onclick=()=>{n=0;ok=0;last="";next()};box.append(b);
}

function radar(axes){
  const NS="http://www.w3.org/2000/svg",cx=180,cy=130,R=70,N=axes.length;
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox","0 0 360 260");svg.style.width="100%";svg.setAttribute("role","img");svg.setAttribute("aria-label","Grafik radar kemajuan belajar");
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  [.25,.5,.75,1].forEach(f=>svg.append(mk("polygon",{points:axes.map((_,i)=>pt(i,R*f).join(",")).join(" "),fill:"none",stroke:"var(--bd)"})));
  axes.forEach((a,i)=>{const[x,y]=pt(i,R);svg.append(mk("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:"var(--bd)"}));
    const[lx,ly]=pt(i,R+16);const t=mk("text",{x:lx,y:ly-6,"text-anchor":lx<cx-5?"end":lx>cx+5?"start":"middle",fill:"var(--mut)","font-size":"11"});
    const s1=mk("tspan",{x:lx});s1.textContent=a.l;const s2=mk("tspan",{x:lx,dy:13});s2.textContent=Math.round(a.v*100)+"%";t.append(s1,s2);svg.append(t)});
  svg.append(mk("polygon",{points:axes.map((a,i)=>pt(i,R*a.v).join(",")).join(" "),fill:"var(--ac)","fill-opacity":".25",stroke:"var(--ac)","stroke-width":"2"}));
  axes.forEach((a,i)=>{const[x,y]=pt(i,R*a.v);svg.append(mk("circle",{cx:x,cy:y,r:3.5,fill:"var(--ac)"}))});
  return svg;
}
function drawStat(v){
  const all=items();let seen=0,mast=0,am=0,r=0,x=0;const c={};
  all.forEach(i=>{const p=S.p[i[0]];if(!p)return;seen++;if(p.b>=4)am++;if(full(i,p))mast++;r+=p.r;x+=p.x;const tt=i[5]||i[3];const k=c[tt]||(c[tt]={r:0,x:0});k.r+=p.r;k.x+=p.x});
  const pct=(a,b)=>a+b?Math.round(a/(a+b)*100)+"%":"-";
  const g=el("div","stats");
  [[all.length,"total kata"],[seen,"sudah dicoba"],[am,"arti dikuasai (tahap bacaan)"],[mast,"hafal penuh (arti, bacaan, jebakan)"],[pct(r,x),"akurasi keseluruhan"]].forEach(([a,b])=>{const s=el("div","stat");s.append(el("b","",a),el("small","",b));g.append(s)});
  v.append(g);
  const rc=el("div","card");rc.style.marginBottom="12px";rc.append(el("b","","Peta kemajuan"));
  if(seen){const axes=[];[...new Set(all.map(i=>i[3]))].forEach(k=>{const li=all.filter(i=>i[3]===k);let m=0,r2=0,x2=0;li.forEach(i=>{const p=S.p[i[0]];if(p){if(full(i,p))m++;r2+=p.r;x2+=p.x}});axes.push({l:"Akurasi "+k,v:r2+x2?r2/(r2+x2):0});axes.push({l:"Hafal "+k,v:m/li.length})});rc.append(radar(axes))}
  else rc.append(el("div","mut","Grafik muncul setelah kamu mengerjakan satu sesi kuis."));
  v.append(rc);
  const bl=BUNSETS[curSet()]||[];if(bl.length){let br=0,bx=0;bl.forEach(b=>{const p=S.p["文:"+b[0]];if(p){br+=p.r;bx+=p.x}});const bc=el("div","card");bc.style.marginBottom="12px";bc.append(el("b","","Bunpou"),el("div","weak","Akurasi: "+pct(br,bx)+" ("+(br+bx)+" jawaban dari "+bl.length+" soal)"));v.append(bc)}
  const cc=el("div","card");cc.append(el("b","","Akurasi per tema"));
  Object.keys(c).forEach(k=>{cc.append(el("div","weak",k+": "+pct(c[k].r,c[k].x)))});
  if(!Object.keys(c).length)cc.append(el("div","mut","Belum ada data. Kerjakan satu sesi kuis dulu."));
  v.append(cc);
  const wk=all.filter(i=>S.p[i[0]]&&S.p[i[0]].x>0).sort((a,b)=>(S.p[b[0]].x-S.p[b[0]].r)-(S.p[a[0]].x-S.p[a[0]].r)).slice(0,8);
  const wc=el("div","card");wc.style.marginTop="12px";wc.append(el("b","","Kata yang paling sering salah"));
  wk.forEach(i=>{const d=el("div","weak"),l=el("div");l.append(el("div","",i[0]+" ("+i[1]+")"),el("small","",i[2]));d.append(l,el("small","","salah "+S.p[i[0]].x+"x · benar "+S.p[i[0]].r+"x"));wc.append(d)});
  if(!wk.length)wc.append(el("div","mut","Belum ada kata yang salah."));
  v.append(wc);
  const rb=el("button","go red","Hapus semua progres");rb.onclick=()=>{if(confirm("Hapus semua progres belajar?")){S.p={};save();n=0;ok=0;cur=null;draw()}};v.append(rb);
}

// Tampilan Papan Peringkat (Leaderboard)
async function drawLeaderboard(v){
  const c=el("div","card");
  c.append(el("b","","Papan Peringkat Global"));
  c.append(el("div","mut","Peringkat disusun berdasarkan jumlah kata/kanji yang sudah dihafal penuh."));
  c.style.marginBottom="12px";
  v.append(c);

  const lbCard=el("div","card");
  lbCard.append(el("div","mut","Memuat daftar peringkat..."));
  v.append(lbCard);

  try{
    const querySnapshot = await getDocs(collection(db, "leaderboard"));
    const list = [];
    querySnapshot.forEach((doc) => {
      list.push(doc.data());
    });
    list.sort((a,b) => (b.mastered || 0) - (a.mastered || 0));

    lbCard.textContent = "";
    if(!list.length){
      lbCard.append(el("div","mut","Belum ada pengguna di leaderboard. Jadilah yang pertama!"));
      return;
    }
    list.forEach((item, index) => {
      const row = el("div","lb-row");
      const left = el("div","row");
      left.style.margin = "0";
      left.append(el("span","lb-rank","#" + (index + 1)));
      left.append(el("div","",item.name || "Anonim"));
      row.append(left, el("b","", (item.mastered || 0) + " hafal"));
      lbCard.append(row);
    });
  } catch(e){
    lbCard.textContent = "";
    lbCard.append(el("div","mut","Gagal memuat leaderboard. Pastikan kamu sudah login."));
  }
}

  bi.onclick=()=>{try{const d=JSON.parse(ta.value);if(!d||typeof d.p!=="object")throw 0;S=merge(S,{p:d.p,c:d.c||[],ns:d.ns||[],set:d.set,f:d.f});save();bm.textContent="Impor berhasil. "+Object.keys(d.p).length+" catatan progres digabung.";ta.value=""}catch(e){bm.textContent="Kode tidak valid. Pastikan seluruh teks tertempel."}};

let tm;
function sy(t){const e=$("#sy");if(e)e.textContent=t}

function countMastered(){
  const all=items();
  let mast=0;
  all.forEach(i=>{const p=S.p[i[0]];if(full(i,p))mast++});
  return mast;
}

// Logika Save & Sync Firestore
async function push(){
  if(!currentUser) return;
  clearTimeout(tm);
  tm=setTimeout(async ()=>{
    try{
      sy("Menyimpan online...");
      // Save data progres personal
      await setDoc(doc(db, "users", currentUser.uid, "appData", "progress"), JSON.parse(JSON.stringify(S)));
      
      // Update data ke Leaderboard global
      const name = currentUser.displayName ? currentUser.displayName.slice(0,20) : "Pengguna Kanji";
      await setDoc(doc(db, "leaderboard", currentUser.uid), {
        name: name,
        mastered: countMastered(),
        updated: Date.now()
      });
      sy("Tersinkron ke akun Google");
    }catch(e){
      sy("Gagal sinkron, data tersimpan di perangkat");
    }
  },800);
}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};

function merge(a,b){
  const o={p:{},c:[],f:a.f!==undefined?!!a.f:!!b.f,set:a.set||b.set,ns:[...new Set([...(a.ns||[]),...(b.ns||[])])]};
  new Set([...Object.keys(a.p||{}),...Object.keys(b.p||{})]).forEach(k=>{const x=(a.p||{})[k],y=(b.p||{})[k];o.p[k]=!x?y:!y?x:(x.r+x.x>=y.r+y.x?x:y)});
  [...(a.c||[]),...(b.c||[])].forEach(i=>{if(!o.c.some(j=>j[0]===i[0]&&(j[4]||"JLPT N3")===(i[4]||"JLPT N3")))o.c.push(i)});return o;
}

// Event Handler Auth Google
const btnLogin = $("#btn-login");
btnLogin.onclick = () => {
  if (currentUser) {
    signOut(auth);
  } else {
    signInWithPopup(auth, provider).catch(err => {
      alert("Gagal login dengan Google: " + err.message);
    });
  }
};

onAuthStateChanged(auth, async (user) => {
  const info = $("#auth-info");
  if (user) {
    currentUser = user;
    info.textContent = "";
    if(user.photoURL){
      const img = el("img","auth-avatar");
      img.src = user.photoURL;
      info.append(img);
    }
    const nameSpan = el("span","",user.displayName || user.email);
    info.append(nameSpan);
    btnLogin.textContent = "Keluar";
    btnLogin.classList.add("out");

    // Load data progres user dari Firestore
    try {
      const docRef = doc(db, "users", user.uid, "appData", "progress");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        S = merge(S, docSnap.data());
        localStorage.setItem(KEY, JSON.stringify(S));
      }
      sy("Terhubung: " + user.displayName);
      push();
    } catch(e) {
      sy("Terhubung (mode offline)");
    }
  } else {
    currentUser = null;
    info.textContent = "";
    info.append(el("span","mut","Disimpan di perangkat ini"));
    btnLogin.textContent = "Login Google";
    btnLogin.classList.remove("out");
  }
  if (view === "stat" || view === "lb") draw();
});

$("#ms").onchange=e=>{let v=e.target.value;if(v==="__new"){v=(prompt("Nama set materi baru?")||"").trim();if(!v||Object.keys(SETS).concat(S.ns||[]).includes(v)){fillSets();return}(S.ns=S.ns||[]).push(v)}S.set=v;cat="*";tema="*";n=0;ok=0;cur=null;locked=false;save();draw()};
